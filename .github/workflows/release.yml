name: Release

# Push a v* tag (matching the app versions) to build the macOS DMG and Windows MSI and
# attach them to a draft GitHub release. Review the draft, then publish it.
# Run manually (Actions -> Release -> Run workflow) to build the installers as workflow
# artifacts without touching releases; pass an existing tag to (re)build its draft release.

on:
  push:
    tags: ['v*']
  # Packaging changes get a full installer build on their PR (artifacts only, no release).
  pull_request:
    paths:
      - .github/workflows/release.yml
      - CursorFollowMac/scripts/**
      - CursorFollowWin/scripts/**
      - CursorFollowWin/installer/**
      - CursorFollowWin/CursorFollowWin.csproj
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build a draft release for (blank = artifacts only)
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.ref }}

      - name: Import self-signed signing identity
        env:
          P12_BASE64: ${{ secrets.MAC_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            if [ -n "$TAG" ]; then echo "::error::MAC_SIGNING_P12 secret is not set"; exit 1; fi
            echo "::warning::No signing secret; building ad-hoc signed (artifacts only)"
            echo "SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(openssl rand -hex 24)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security import "$RUNNER_TEMP/identity.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/identity.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

      - name: Build, sign, package, verify
        run: ./CursorFollowMac/scripts/package.sh

      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: build/CursorFollowMac-*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build MSI (unsigned)
        shell: pwsh
        run: ./CursorFollowWin/scripts/package.ps1 -Rid win-x64
      - uses: actions/upload-artifact@v7
        with:
          name: windows-msi
          path: CursorFollowWin/installer/dist/*.msi
          if-no-files-found: error

  release:
    if: ${{ github.event_name == 'push' || inputs.tag != '' }}
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Check installer versions match the tag
        run: |
          v="${TAG#v}"
          ls dist
          ls dist/CursorFollowMac-"$v".dmg dist/CursorFollowWin-"$v"-win-x64.msi
      - name: Release notes from CHANGELOG.md
        run: |
          v="${TAG#v}"
          awk -v v="$v" '$0 == "## " v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::No '## $v' section in CHANGELOG.md"; exit 1; }
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --draft --verify-tag --title "CursorFollow ${TAG#v}" --notes-file notes.md
          fi
