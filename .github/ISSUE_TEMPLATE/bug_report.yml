name: Bug report
description: Something doesn't work as described.
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Windows, Linux (Hyprland)]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CursorFollow version
      description: Settings → About, or the release you downloaded.
      placeholder: 0.5.1
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version
      placeholder: macOS 15.3 / Windows 11 24H2 / Arch + Hyprland 0.50
    validations:
      required: true
  - type: input
    id: sharing-to
    attributes:
      label: Sharing to
      description: The meeting or streaming app, if it matters.
      placeholder: Zoom, Meet, Teams, OBS...
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Steps to reproduce, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Settings → Open log file (macOS/Windows), or run with `G_MESSAGES_DEBUG=CursorFollow` (Linux).
